services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: iot-jenkins:2.567-jdk21-python3
    container_name: jenkins
    group_add:
      - "${DOCKER_GID:-991}"
    ports:
      - "${JENKINS_HTTP_PORT}:8080"
      - "${JENKINS_AGENT_PORT}:50000"
    volumes:
      - "${RUNTIME_ROOT}/jenkins/home:/var/jenkins_home"
      - "${ARTIFACT_ROOT}/firmware:/opt/firmware-artifacts"
      - "${PROJECT_ROOT}/deploy/jenkins/init.groovy.d/ensure-dingtalk-credential.groovy:/var/jenkins_home/init.groovy.d/ensure-dingtalk-credential.groovy:ro"
      - /usr/bin/docker:/usr/bin/docker
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/docker/daemon.json:/etc/docker/daemon.json:ro
    secrets:
      - dingtalk_token
    restart: unless-stopped
    networks:
      - jenkins-net
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

networks:
  jenkins-net:
    driver: bridge

secrets:
  dingtalk_token:
    file: "${DINGTALK_TOKEN_FILE}"
