[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "5s"
  flush_jitter = "0s"
  precision = ""
  debug = true
  quiet = false
  logfile = ""
  hostname = "iot-telegraf"
  omit_hostname = false

# 输出到 InfluxDB v2
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"

# 输入源 1: 订阅温湿度传感器数据 (JSON 格式)
[[inputs.mqtt_consumer]]
  servers = ["tcp://iot-mqtt:1883"]
  topics = [
    "telemetry/#"
  ]
  data_format = "json"
  json_string_fields = ["version"]
  name_override = "sensor_data"

# 输入源 2: 订阅设备遗嘱与上下线状态 (纯字符串格式)
[[inputs.mqtt_consumer]]
  servers = ["tcp://iot-mqtt:1883"]
  topics = [
    "device/+/status"
  ]
  data_format = "value"
  data_type = "string"
  name_override = "device_status"

# ================= 监控宿主机性能指标 =================
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.system]]

# ================= 监控 Docker 容器状态 =================
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  container_name_include = []
  container_name_exclude = []
  timeout = "5s"
