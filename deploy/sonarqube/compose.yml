services:
  db:
    image: postgres:13
    container_name: sonar-db
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - sonarnet
    environment:
      POSTGRES_USER: "${SONAR_DB_USER}"
      POSTGRES_PASSWORD: "${SONAR_DB_PASSWORD}"
    volumes:
      - "${RUNTIME_ROOT}/sonarqube/postgres:/var/lib/postgresql/data"

  sonarqube:
    image: sonarqube:9.9-community
    container_name: sonarqube
    depends_on:
      - db
    ports:
      - "${SONARQUBE_PORT}:9000"
    networks:
      - sonarnet
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: "${SONAR_DB_USER}"
      SONAR_JDBC_PASSWORD: "${SONAR_DB_PASSWORD}"
    volumes:
      - "${RUNTIME_ROOT}/sonarqube/data:/opt/sonarqube/data"
      - "${RUNTIME_ROOT}/sonarqube/extensions:/opt/sonarqube/extensions"

networks:
  sonarnet:
    driver: bridge
